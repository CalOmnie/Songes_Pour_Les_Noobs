<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script type="text/javascript">
        // Single Page Apps for GitHub Pages
        // MIT License
        // https://github.com/rafgraph/spa-github-pages
        // GitHub Pages serves this file for any unmatched path (e.g. a direct link
        // or refresh on /tous-les-boss or /mon-combat, which have no real file on
        // this static host). It re-encodes the requested path as a query string on
        // the site root, where index.html lives, so Blazor's own client-side router
        // can then take over. pathSegmentsToKeep = 1 preserves the repo name segment
        // ("Songes_Pour_Les_Noobs") that GitHub Pages project sites are served under.
        var pathSegmentsToKeep = 1;

        var l = window.location;
        l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
            l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        );
    </script>
</head>
<body>
</body>
</html>
